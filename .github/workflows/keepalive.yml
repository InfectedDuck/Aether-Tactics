name: Keepalive

# Free-tier sleep insurance: Supabase pauses free projects after 7 idle days
# and Render free spins down after ~15 idle minutes. This hits a real query
# (profiles count) twice a week, which resets Supabase's activity clock.
# It does NOT unpause an already-paused project (failed queries are not
# activity) and it does NOT keep Render warm between runs — Render still
# cold-starts, which the app degrades through gracefully.
# No secrets needed: the backend URL is public (see README live links).
on:
  schedule:
    - cron: "20 3 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database health
        run: curl -fsS --retry 3 --retry-all-errors --max-time 100 https://aether-tactics-backend.onrender.com/api/database/health
